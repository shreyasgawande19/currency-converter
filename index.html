<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Currency Converter</h1>

        <form>

            <div class="amount">
                <p>Enter Amount</p>
                <input type="number" placeholder="Enter Amount" required>
            </div>

            <div class="dropdown">

                <div class="from">
                    <p>From</p>

                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="US Flag">

                        <select name="from" class="fromCurrency"></select>
                    </div>
                </div>

                <div class="to">
                    <p>To</p>

                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png" alt="India Flag">

                        <select name="to" class="toCurrency"></select>
                    </div>
                </div>

            </div>

            <div class="msg">
                1 USD = 83 INR
            </div>

            <button type="submit">
                Convert
            </button>

        </form>
    </div>

    <script src="code.js"></script>
    <script src="app.js"></script>

</body>

</html>
